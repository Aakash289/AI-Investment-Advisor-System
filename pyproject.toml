[project]
name = "invest-agent"
version = "0.1.0"
description = "Investment suitability AI agent: fundamentals, macro, and news analysis via MCP-backed agents, orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "openai>=1.50",
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "tenacity>=9.0",
    "rich>=13.8",
    "rapidfuzz>=3.14.6",
    "edgartools>=5.60.0",
    "reportlab>=5.0.1",
    "matplotlib>=3.11.2",
    "gradio>=6.29.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: quick connectivity checks against a single external dependency (model API or one data source)",
]
