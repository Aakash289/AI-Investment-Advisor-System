# Trusted outlets per market and the press release wires (design 14.6).
US:
  - reuters.com
  - apnews.com
  - bloomberg.com
  - cnbc.com
  - wsj.com
  - ft.com
IN:
  - economictimes.indiatimes.com
  - business-standard.com
  - livemint.com
  - thehindubusinessline.com
  - reuters.com
  - moneycontrol.com          # added 4 October 2026
  - financialexpress.com      # added 4 October 2026
  - ndtvprofit.com            # added 4 October 2026
  - cnbctv18.com              # added 4 October 2026
press_release_wires:          # allowed, always labelled company statement
