# mcp_servers/filings/sector_taxonomy.yaml: our 11 sectors and how labels map to them (design 14.7).
#
# The sector sensitivity table (step 9) and the macro fit score are keyed by these 11
# names. US companies are classed by their SIC code from SEC (it wins when it disagrees
# with Yahoo, and the disagreement is flagged); Indian companies by Yahoo's sector, since
# Yahoo's 11 sectors broadly match ours.

sectors:
  - Energy
  - Materials
  - Industrials
  - Consumer Discretionary
  - Consumer Staples
  - Health Care
  - Financials
  - Information Technology
  - Communication Services
  - Utilities
  - Real Estate

# Yahoo's sector names to ours (checked 6 October: Apple "Technology", Reliance "Energy").
yahoo:
  Technology: Information Technology
  Communication Services: Communication Services
  Consumer Cyclical: Consumer Discretionary
  Consumer Defensive: Consumer Staples
  Energy: Energy
  Financial Services: Financials
  Healthcare: Health Care
  Industrials: Industrials
  Basic Materials: Materials
  Real Estate: Real Estate
  Utilities: Utilities

# SIC code ranges to sectors, [first, last, sector]. Checked from top to bottom; the first
# range containing the code wins, so the narrow ranges come before the wide ones.
sic:
